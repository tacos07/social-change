# ---------------------------------------------------------------------------
# Human-editable settings. SAFE TO COMMIT — this file contains NO secrets.
# The Signal link and all credentials live in environment variables only.
# ---------------------------------------------------------------------------

app_name: "Social Change"

# Public repo URL, shown as a GitHub mark in the top-right corner. Anyone can
# read exactly what this site does with their address. Leave blank to hide it —
# do that if the repo is private, or the mark just leads visitors to a 404.
repo_url: "https://github.com/tacos07/social-change"

# Only these email domains may request access.
#
# Each entry can be:
#   - iitb.ac.in                      (just the domain)
#   - domain: iitb.ac.in              (domain + the name shown on screen)
#     name: IIT Bombay
#
# Prefer the second form. The site lists these in a collapsed panel, and a
# reader can tell "IIT Kanpur" from "IIT Kharagpur" far quicker than they can
# tell iitk.ac.in from iitkgp.ac.in. The name is free text, so this list is not
# limited to universities: a company, a society, or a chapter works the same
# way. Add entries by adding lines; the panel collapses and scrolls on its own,
# so it can grow without pushing the form off the screen.
allowed_domains:
  - domain: iitbombay.org
    name: IIT Bombay Alumni Association

# One-time code lifetime, in seconds (default 10 minutes).
otp_ttl_seconds: 600

# How long the Signal redirect stays valid after a successful verification,
# in seconds (default 3 minutes). This is your "short link expiry".
redirect_ttl_seconds: 180

# Maximum wrong code attempts before the code is voided (you asked for 3).
max_attempts: 3

# Anti-abuse: maximum OTP emails allowed per IP address per 15 minutes.
otp_requests_per_15min: 5
